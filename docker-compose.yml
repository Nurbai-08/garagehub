services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garagehub}
      POSTGRES_USER: ${POSTGRES_USER:-garagehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garagehub} -d ${POSTGRES_DB:-garagehub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-garagehub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/garagehub}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-garagehub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/garagehub}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      ALLOWED_IMAGE_HOSTS: ${ALLOWED_IMAGE_HOSTS:-localhost,127.0.0.1,backend}
      IMAGE_STORAGE_BACKEND: ${IMAGE_STORAGE_BACKEND:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-4}
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
